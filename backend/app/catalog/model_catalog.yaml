# Model catalog: single source of truth for data types, tasks, model families, AutoML candidates and the
# pretrained-weight manifest (model zoo). Human doc: docs/MODEL_CATALOG.md. Trainer registry ids must match.
version: 2

data_types:
  TABULAR:  { label: 表格,  formats: [csv, parquet] }
  IMAGE:    { label: 圖片,  formats: [image_folder, coco, yolo] }
  SEQUENCE: { label: 序列,  formats: [csv, npy] }
  TEXT:     { label: 文字,  formats: [csv, jsonl] }
  SPECTRUM: { label: 光譜,  formats: [spectrum_csv, npy] }

tasks:
  classification:    { label: 分類,     metrics: [f1_macro, accuracy, auroc], direction: maximize, needs_labels: true }
  regression:        { label: 迴歸,     metrics: [rmse, mae, r2],            direction: minimize, needs_labels: true }
  detection:         { label: 物件偵測, metrics: [map50_95, map50],          direction: maximize, needs_labels: true }
  segmentation:      { label: 分割,     metrics: [mask_map50_95, mask_map50], direction: maximize, needs_labels: true }
  anomaly_detection: { label: 異常偵測, metrics: [auroc, f1],                direction: maximize, needs_labels: false }

# augment_choices: train-time augmentation ops the wizard offers as a multi-select (defaults.augment = preselected)
# inference_modes: what a trained artifact can be asked to do at inference time
#   predict   → label / value per sample            detect / segment → boxes / masks
#   score     → anomaly score + threshold verdict    embed → vector per sample
#   retrieve  → nearest / farthest against a reference set (golden library)   measure → geometry from masks
families:
  tabular.linear:
    label: 線性 / 邏輯迴歸
    group: tabular
    framework: sklearn
    supports: { TABULAR: [classification, regression], TEXT: [classification] }
    inference_modes: [predict]
    resources: { gpu: none, cpu_min: 1, memory_mb_min: 1024 }
    min_rows: 50
    defaults: { C: 1.0, alpha: 1.0 }
    search_space:
      C: { type: float, low: 0.001, high: 100, log: true }
    weights: []
    sop: 最簡單、可解釋、秒級訓練，當基準線。TEXT 時自動接 TF-IDF。

  tabular.svm:
    label: SVM
    group: tabular
    framework: sklearn
    supports: { TABULAR: [classification, regression] }
    inference_modes: [predict]
    resources: { gpu: none, cpu_min: 1, memory_mb_min: 2048 }
    max_rows: 50000
    defaults: { C: 1.0, kernel: rbf, gamma: scale }
    search_space:
      C: { type: float, low: 0.01, high: 100, log: true }
      gamma: { type: float, low: 0.0001, high: 1, log: true }
      kernel: { type: categorical, choices: [rbf, linear] }
    weights: []
    sop: 小資料、特徵多時表現好；超過 5 萬列會很慢。

  tabular.random_forest:
    label: 隨機森林
    group: tabular
    framework: sklearn
    supports: { TABULAR: [classification, regression] }
    inference_modes: [predict]
    resources: { gpu: none, cpu_min: 2, memory_mb_min: 2048 }
    defaults: { n_estimators: 300, max_depth: null, min_samples_leaf: 1 }
    search_space:
      n_estimators: { type: int, low: 100, high: 800 }
      max_depth: { type: int, low: 4, high: 32 }
      min_samples_leaf: { type: int, low: 1, high: 10 }
    weights: []
    sop: 穩健、不太需要調參、給特徵重要度。

  tabular.xgboost:
    label: XGBoost
    group: tabular
    framework: xgboost
    supports: { TABULAR: [classification, regression] }
    inference_modes: [predict]
    resources: { gpu: optional, cpu_min: 2, memory_mb_min: 2048 }
    min_rows: 200
    defaults: { n_estimators: 500, learning_rate: 0.05, max_depth: 6, subsample: 0.8, colsample_bytree: 0.8 }
    search_space:
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      max_depth: { type: int, low: 3, high: 10 }
      min_child_weight: { type: int, low: 1, high: 10 }
      subsample: { type: float, low: 0.5, high: 1.0 }
      colsample_bytree: { type: float, low: 0.5, high: 1.0 }
      reg_lambda: { type: float, low: 0.001, high: 10, log: true }
    weights: []
    sop: 表格資料的預設首選，多數情況最準。

  tabular.catboost:
    label: CatBoost
    group: tabular
    framework: catboost
    supports: { TABULAR: [classification, regression] }
    inference_modes: [predict]
    resources: { gpu: optional, cpu_min: 2, memory_mb_min: 2048 }
    min_rows: 100
    defaults: { iterations: 500, learning_rate: 0.05, depth: 6, l2_leaf_reg: 3.0 }
    search_space:
      iterations: { type: int, low: 200, high: 1000 }
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      depth: { type: int, low: 4, high: 10 }
      l2_leaf_reg: { type: float, low: 1, high: 10, log: true }
    weights: []
    sop: 梯度提升樹的另一個強基準（有序提升、對類別欄與小資料較穩）；與 XGBoost 一起試，取 leaderboard 較好的。

  tabular.tabpfn:
    label: TabPFN（表格基礎模型，免訓練）
    group: tabular
    framework: tabpfn
    supports: { TABULAR: [classification, regression] }
    inference_modes: [predict]
    resources: { gpu: optional, cpu_min: 2, memory_mb_min: 4096 }
    min_rows: 20
    max_rows: 50000
    defaults: { n_estimators: auto }
    search_space:
      n_estimators: { type: categorical, choices: [1, 4, 8] }
    weights:
      - { id: tabpfn-v2.5-classifier, file: tabpfn-v2.5-classifier-v2.5_default.ckpt, source: "https://huggingface.co/Prior-Labs/tabpfn_2_5/resolve/main/tabpfn-v2.5-classifier-v2.5_default.ckpt", license: PriorLabs-License, sha256: null, kind: hf_file }
      - { id: tabpfn-v2.5-regressor,  file: tabpfn-v2.5-regressor-v2.5_default.ckpt,  source: "https://huggingface.co/Prior-Labs/tabpfn_2_5/resolve/main/tabpfn-v2.5-regressor-v2.5_default.ckpt",  license: PriorLabs-License, sha256: null, kind: hf_file }
    sop: 預訓練在大量合成表格上的 transformer，直接把訓練列放進上下文做預測，不用調參、小資料（幾十到幾千列）通常最準；超過 1 萬列改用 XGBoost / CatBoost。權重從模型庫載入（PriorLabs 授權），有 GPU 快很多。

  tabular.isolation_forest:
    label: Isolation Forest
    group: tabular
    framework: sklearn
    supports: { TABULAR: [anomaly_detection] }
    inference_modes: [score]
    resources: { gpu: none, cpu_min: 1, memory_mb_min: 1024 }
    defaults: { n_estimators: 200, contamination: auto }
    search_space:
      n_estimators: { type: int, low: 100, high: 500 }
      max_samples: { type: float, low: 0.2, high: 1.0 }
    weights: []
    sop: 只用正常（或大多正常）的表格資料找離群樣本，例如 WAT / PCM 參數異常。

  vision.yolo:
    # detection weights come from the Hugging Face mirror (Ultralytics/YOLOv8); the -seg / -cls files are not
    # hosted there, so they stay on the GitHub release the ultralytics package itself downloads from
    label: YOLO
    group: vision
    framework: ultralytics
    supports: { IMAGE: [detection, segmentation, classification] }
    inference_modes: [detect, segment, predict]
    resources: { gpu: required, cpu_min: 4, memory_mb_min: 8192 }
    min_rows: 200
    defaults: { model: yolov8s, imgsz: 640, epochs: 100, lr0: 0.01, batch: -1, pretrained: true, freeze: auto, augment: [hflip, crop, brightness] }
    augment_choices: [hflip, vflip, rotate90, crop, brightness]
    search_space:
      model: { type: categorical, choices: [yolov8n, yolov8s, yolov8m] }
      imgsz: { type: categorical, choices: [512, 640, 800] }
      lr0: { type: float, low: 0.001, high: 0.02, log: true }
      epochs: { type: int, low: 50, high: 150 }
      freeze: { type: categorical, choices: [auto, 0, 10] }
      augment: { type: categorical, choices: [default, none] }
    weights:
      - { id: yolov8n,     file: yolov8n.pt,     source: "https://huggingface.co/Ultralytics/YOLOv8/resolve/main/yolov8n.pt",     license: AGPL-3.0, sha256: null, kind: hf_file }
      - { id: yolov8s,     file: yolov8s.pt,     source: "https://huggingface.co/Ultralytics/YOLOv8/resolve/main/yolov8s.pt",     license: AGPL-3.0, sha256: null, kind: hf_file }
      - { id: yolov8m,     file: yolov8m.pt,     source: "https://huggingface.co/Ultralytics/YOLOv8/resolve/main/yolov8m.pt",     license: AGPL-3.0, sha256: null, kind: hf_file }
      - { id: yolov8n-seg, file: yolov8n-seg.pt, source: "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8n-seg.pt", license: AGPL-3.0, sha256: null, kind: file }
      - { id: yolov8s-seg, file: yolov8s-seg.pt, source: "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8s-seg.pt", license: AGPL-3.0, sha256: null, kind: file }
      - { id: yolov8m-seg, file: yolov8m-seg.pt, source: "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8m-seg.pt", license: AGPL-3.0, sha256: null, kind: file }
      - { id: yolov8n-cls, file: yolov8n-cls.pt, source: "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8n-cls.pt", license: AGPL-3.0, sha256: null, kind: file }
      - { id: yolov8s-cls, file: yolov8s-cls.pt, source: "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8s-cls.pt", license: AGPL-3.0, sha256: null, kind: file }
      - { id: yolov8m-cls, file: yolov8m-cls.pt, source: "https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8m-cls.pt", license: AGPL-3.0, sha256: null, kind: file }
    sop: 即時物件偵測 / 分割 / 分類的標準做法；可從模型庫的預訓練權重微調，或 pretrained=false 從頭訓練。freeze=auto：影像少於 200 張時凍結骨幹只訓練頸部與頭（較穩），多的話整個網路一起訓練；augment 全部不勾時連 YOLO 內建的 mosaic / 色相 / RandAugment 也關掉；自動模式會各試「預設增強」與「完全不增強」。

  vision.dino:
    label: DINO 影像分類（凍結或微調 → 特徵 → 分類頭 / PatchCore）
    group: vision
    framework: torch
    supports: { IMAGE: [classification] }
    inference_modes: [predict, embed, retrieve]
    resources: { gpu: required, cpu_min: 2, memory_mb_min: 8192 }
    min_rows: 5
    # step 1 finetune: none (frozen) / lora (adapters, the default when fine-tuning) / full; step 2 features:
    # patch tokens only (no CLS), mean per layer, layers concatenated — layers last / cross (9,10,11 of 12,
    # scaled by depth) / a list; step 3 head: auto (prototype below 10 images per class, else linear) /
    # prototype / knn / linear / svm; patchcore: auto (on when a normal folder good / normal / ok / pass or
    # normal_class exists) / on / off → the bank decides normal vs defect, the anomalous patches are classified.
    defaults: { backbone: dinov2-small, finetune: none, image_size: 224, layers: cross, head: auto, k: auto, patchcore: auto, normal_class: "", neighborhood: 1, score_agg: auto, coreset_ratio: auto, bank_augment: auto, epochs: auto, batch: auto, lr: 0.001, rank: 8, lora_alpha: 16, backbone_lr: 0.00001, augment: [crop, hflip] }
    augment_choices: [hflip, vflip, rotate90, crop, brightness, contrast]
    search_space:
      backbone: { type: categorical, choices: [dinov2-small, dinov2-base, dinov3-vits16, dinov3-vitb16] }
      finetune: { type: categorical, choices: [none, lora] }
      layers: { type: categorical, choices: [last, cross] }
      head: { type: categorical, choices: [prototype, knn, linear, svm] }
      image_size: { type: categorical, choices: [224, 336] }
      augment: { type: categorical, choices: [default, none] }
      lr: { type: float, low: 0.0001, high: 0.01, log: true }
      rank: { type: categorical, choices: [4, 8, 16] }
    weights:
      - { id: dinov2-small, file: dinov2-small/, source: "https://huggingface.co/facebook/dinov2-small", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov2-base, file: dinov2-base/, source: "https://huggingface.co/facebook/dinov2-base", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov3-vits16, file: dinov3-vits16/, source: "https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
      - { id: dinov3-vitb16, file: dinov3-vitb16/, source: "https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
    sop: 一條流程三步：先決定要不要微調骨幹（finetune = none 凍結、lora 在注意力層加低秩轉接器（微調的預設）、full 全參數），再從（微調過的）骨幹讀 patch 特徵（layers = cross 跨層 9/10/11 或 last），最後接分類（head = auto 在每類不到 10 張時用最近原型、夠多用線性頭；也可選 knn / svm）。新增類別只要加幾張範例（extend），不用重訓。資料夾裡有正常類別（good / normal / ok / pass，或 normal_class 指定）時自動開 PatchCore：先用正常影像的 patch 庫判正不正常，異常的只拿異常區塊去分缺陷類別，沒看過的缺陷回 unknown。

  # ---- deprecated ids: kept so artifacts and job rows from before the merge still resolve (not selectable) ----
  vision.dino_fewshot:
    label: DINO 特徵分類（舊：已併入 vision.dino）
    group: vision
    framework: torch
    deprecated: true
    supports: { IMAGE: [classification] }
    inference_modes: [predict, embed, retrieve]
    resources: { gpu: required, cpu_min: 2, memory_mb_min: 8192 }
    min_rows: 5
    defaults: {}
    search_space: {}
    weights:
      - { id: dinov2-small, file: dinov2-small/, source: "https://huggingface.co/facebook/dinov2-small", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov2-base, file: dinov2-base/, source: "https://huggingface.co/facebook/dinov2-base", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov3-vits16, file: dinov3-vits16/, source: "https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
      - { id: dinov3-vitb16, file: dinov3-vitb16/, source: "https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
    sop: 舊家族；新任務請用 vision.dino（finetune = none）。

  vision.dino_finetune:
    label: DINO 微調分類（舊：已併入 vision.dino）
    group: vision
    framework: torch
    deprecated: true
    supports: { IMAGE: [classification] }
    inference_modes: [predict, embed, retrieve]
    resources: { gpu: required, cpu_min: 2, memory_mb_min: 8192 }
    min_rows: 20
    defaults: {}
    search_space: {}
    weights:
      - { id: dinov2-small, file: dinov2-small/, source: "https://huggingface.co/facebook/dinov2-small", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov2-base, file: dinov2-base/, source: "https://huggingface.co/facebook/dinov2-base", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov3-vits16, file: dinov3-vits16/, source: "https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
      - { id: dinov3-vitb16, file: dinov3-vitb16/, source: "https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
    sop: 舊家族；新任務請用 vision.dino（finetune = lora）。

  vision.dino_patchcore:
    label: DINO PatchCore 異常偵測
    group: vision
    framework: torch
    supports: { IMAGE: [anomaly_detection] }
    inference_modes: [score, embed]
    resources: { gpu: required, cpu_min: 2, memory_mb_min: 8192 }
    min_rows: 20
    defaults: { backbone: dinov2-small, image_size: 224, layers: cross, neighborhood: 1, score_agg: auto, coreset_ratio: auto, bank_augment: auto, k: 3 }
    search_space:
      backbone: { type: categorical, choices: [dinov2-small, dinov3-vits16] }
      layers: { type: categorical, choices: [last, cross] }
      image_size: { type: categorical, choices: [224, 336, 448] }
      neighborhood: { type: categorical, choices: [1, 3] }
      k: { type: int, low: 1, high: 9 }
    weights:
      - { id: dinov2-small, file: dinov2-small/, source: "https://huggingface.co/facebook/dinov2-small", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: dinov3-vits16, file: dinov3-vits16/, source: "https://huggingface.co/facebook/dinov3-vits16-pretrain-lvd1689m", license: DINOv3-License, sha256: null, kind: hf_repo }
    sop: 只用正常影像的 patch 特徵建記憶庫，異常分數 = 每個 patch 到記憶庫的最近鄰距離，影像分數 = 最大值或前 1% 平均（score_agg=auto 依 patch 數決定），並輸出熱圖定位。layers = cross（9/10/11）或 last；coreset_ratio=auto 讓記憶庫不超過 10 萬個 patch；正常影像少於 20 張時 bank_augment=auto 會把翻轉 / 旋轉後的影像也放進庫；小瑕疵把 image_size 拉到 336 / 448；neighborhood=3 做 PatchCore 的鄰域池化。

  vision.image_quality:
    label: 影像品質基準（機台比對）
    group: vision
    framework: numpy
    supports: { IMAGE: [anomaly_detection] }
    inference_modes: [compare, score, embed]
    resources: { gpu: none, cpu_min: 1, memory_mb_min: 2048 }
    min_rows: 20
    defaults: { z_threshold: 3.0, distance_percentile: 99 }
    search_space: {}
    weights: []
    sop: 用黃金機台的影像集算出 17 個無參考影像品質指標（清晰度、雜訊、對比、亮度、飽和、熵、頻譜、方向性）的基準與浮動範圍；其他機台調機後用 compare 模式比對，每個指標回報 match / drift / fail。不需要 GPU 與權重。

  sequence.patch_autoencoder:
    label: Patch Autoencoder
    group: sequence
    framework: torch
    supports: { SEQUENCE: [anomaly_detection], SPECTRUM: [anomaly_detection] }
    inference_modes: [score, embed, retrieve]
    resources: { gpu: optional, cpu_min: 2, memory_mb_min: 4096 }
    min_rows: 200
    defaults: { patch_size: 16, latent: 32, layers: 3, lr: 0.001, epochs: 50, score_method: recon, coreset_ratio: 0.1, bank_k: 3 }
    search_space:
      patch_size: { type: categorical, choices: [8, 16, 32] }
      latent: { type: int, low: 8, high: 128 }
      layers: { type: int, low: 2, high: 4 }
      lr: { type: float, low: 0.0001, high: 0.01, log: true }
      score_method: { type: categorical, choices: [recon, patch_bank] }
    weights: []
    sop: 曲線切 patch 後做自編碼器，重建誤差大 = 異常；embedding 可拿來找最相似 / 最不相似的樣本。score 回每個 patch 的分數與最偏離的區段（hot_band_start / end = 樣本點範圍）；score_method=patch_bank 改用「正常 patch 庫」的最近鄰距離（PatchCore 的一維版）。

  spectrum.masked_autoencoder:
    label: 光譜 Masked Autoencoder
    group: spectrum
    framework: torch
    supports: { SPECTRUM: [anomaly_detection, regression] }
    inference_modes: [score, embed, retrieve, predict]
    resources: { gpu: optional, cpu_min: 2, memory_mb_min: 4096 }
    min_rows: 500
    defaults: { patch_size: 16, mask_ratio: 0.5, dim: 64, depth: 4, heads: 4, lr: 0.0005, epochs: 100, embed_layers: last, embed_pool: mean, score_method: recon, coreset_ratio: 0.1, bank_k: 3 }
    search_space:
      patch_size: { type: categorical, choices: [8, 16, 32] }
      mask_ratio: { type: float, low: 0.3, high: 0.75 }
      dim: { type: categorical, choices: [32, 64, 128] }
      depth: { type: int, low: 2, high: 6 }
      lr: { type: float, low: 0.0001, high: 0.005, log: true }
      embed_layers: { type: categorical, choices: [last, all] }
      embed_pool: { type: categorical, choices: [mean, meanmax] }
      score_method: { type: categorical, choices: [recon, patch_bank] }
    weights: []
    sop: 把光譜切 patch 隨機遮蔽再重建，學到的 embedding 做光譜鑑別器：與黃金樣本比相似度、找最不相似、追蹤漂移；有標籤時接迴歸頭預測 CD / 厚度。embedding 可選讀哪些編碼層（embed_layers：最後一層 / 全部拼接）與怎麼 pooling（embed_pool：mean / meanmax）；score 回每個 patch 的分數與最偏離的波段（hot_band_start / end），score_method=patch_bank 改用正常 patch token 庫的最近鄰距離。

  spectrum.pls:
    label: PLS 迴歸 / PLS-DA 分類
    group: spectrum
    framework: sklearn
    supports: { SPECTRUM: [regression, classification] }
    inference_modes: [predict, embed]
    resources: { gpu: none, cpu_min: 1, memory_mb_min: 2048 }
    min_rows: 20
    defaults: { n_components: 10, scale: false }
    search_space:
      n_components: { type: int, low: 2, high: 30 }
    weights: []
    sop: 化學計量學的標準做法：光譜 → 量測值（CD / 膜厚 / 濃度）用 PLS 迴歸，光譜分類用 PLS-DA（PLS 分數 + 邏輯迴歸）。幾十筆就能用、秒級、可解釋（report/vip.csv 說哪些波長重要）；有標籤的光譜先用這個，再和 MAE 比。

  text.bert_classifier:
    label: BERT 分類器
    group: text
    framework: transformers
    supports: { TEXT: [classification] }
    inference_modes: [predict, embed]
    resources: { gpu: required, cpu_min: 4, memory_mb_min: 8192 }
    min_rows: 300
    defaults: { model: bert-base-chinese, max_len: 256, lr: 0.00002, epochs: 3, batch: 16 }
    search_space:
      lr: { type: float, low: 0.00001, high: 0.00005, log: true }
      epochs: { type: int, low: 2, high: 5 }
      max_len: { type: categorical, choices: [128, 256, 512] }
    weights:
      - { id: bert-base-chinese, file: bert-base-chinese/, source: "https://huggingface.co/google-bert/bert-base-chinese", license: Apache-2.0, sha256: null, kind: hf_repo }
      - { id: xlm-roberta-base,  file: xlm-roberta-base/,  source: "https://huggingface.co/FacebookAI/xlm-roberta-base", license: MIT, sha256: null, kind: hf_repo }
    sop: 預訓練 BERT 接分類頭，語意理解；權重從模型庫離線載入。

  text.qwen_embedding:
    label: Qwen3 Embedding（語意向量：相似搜尋、分類、新型問題偵測）
    group: text
    framework: transformers
    supports: { TEXT: [classification, anomaly_detection] }
    inference_modes: [predict, retrieve, embed, score]
    resources: { gpu: optional, cpu_min: 4, memory_mb_min: 8192 }
    min_rows: 20
    defaults: { model: qwen3-embedding-0.6b, max_len: 512, batch: 16, C: 1.0, instruction: "", pool: last_token }
    search_space:
      C: { type: float, low: 0.01, high: 100, log: true }
      max_len: { type: categorical, choices: [256, 512, 1024] }
      pool: { type: categorical, choices: [last_token, mean] }
    weights:
      - { id: qwen3-embedding-0.6b, file: qwen3-embedding-0.6b/, source: "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B", license: Apache-2.0, sha256: null, kind: hf_repo }
    sop: 凍結的 Qwen3-Embedding（多語、含中文）把每段文字變成語意向量，不微調。分類：向量接邏輯迴歸（幾十筆就能用，比 BERT 微調快很多）；retrieve：找最相似 / 最不相似的歷史工單、log（可選方向與筆數）；anomaly_detection：和歷史紀錄都不像的新型問題（novelty 分數）；embed：向量給分群 / 報表。pool=mean（對長 log、條列式工單較穩）是可選的特徵產生方式。

automl:
  - data_type: TABULAR
    tasks: [classification, regression]
    candidates: [tabular.xgboost, tabular.catboost, tabular.tabpfn, tabular.random_forest, tabular.linear, tabular.svm]
    rules:
      - { if: "row_count > 50000", drop: [tabular.svm] }
      - { if: "row_count > 10000", drop: [tabular.tabpfn] }
      - { if: "row_count < 1000", prefer: [tabular.tabpfn, tabular.random_forest] }
    budget: { max_trials: 20, time_budget_minutes: 60 }
  - data_type: TABULAR
    tasks: [anomaly_detection]
    candidates: [tabular.isolation_forest]
    budget: { max_trials: 10, time_budget_minutes: 20 }
  - data_type: IMAGE
    tasks: [classification]
    candidates: [vision.dino, vision.yolo]
    rules:
      - { if: "row_count < 100", drop: [vision.yolo] }
    budget: { max_trials: 8, time_budget_minutes: 120 }
  - data_type: IMAGE
    tasks: [detection, segmentation]
    candidates: [vision.yolo]
    budget: { max_trials: 8, time_budget_minutes: 120 }
  - data_type: IMAGE
    tasks: [anomaly_detection]
    candidates: [vision.dino_patchcore, vision.image_quality]
    budget: { max_trials: 6, time_budget_minutes: 60 }
  - data_type: SEQUENCE
    tasks: [anomaly_detection]
    candidates: [sequence.patch_autoencoder]
    budget: { max_trials: 10, time_budget_minutes: 60 }
  - data_type: SPECTRUM
    tasks: [anomaly_detection]
    candidates: [spectrum.masked_autoencoder, sequence.patch_autoencoder]
    budget: { max_trials: 10, time_budget_minutes: 60 }
  - data_type: SPECTRUM
    tasks: [regression]
    candidates: [spectrum.pls, spectrum.masked_autoencoder]
    rules:
      - { if: "row_count < 500", drop: [spectrum.masked_autoencoder] }
    budget: { max_trials: 10, time_budget_minutes: 60 }
  - data_type: SPECTRUM
    tasks: [classification]
    candidates: [spectrum.pls]
    budget: { max_trials: 10, time_budget_minutes: 30 }
  - data_type: TEXT
    tasks: [classification]
    candidates: [text.qwen_embedding, text.bert_classifier, tabular.linear]
    rules:
      - { if: "row_count < 300", drop: [text.bert_classifier] }
    budget: { max_trials: 8, time_budget_minutes: 120 }
  - data_type: TEXT
    tasks: [anomaly_detection]
    candidates: [text.qwen_embedding]
    budget: { max_trials: 4, time_budget_minutes: 60 }
