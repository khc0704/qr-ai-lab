# /etc/nginx/sites-available/qr-ai-lab → sites-enabled. The frontend (3000) serves the UI and proxies uploads,
# SSE and downloads to the backend itself, so only the frontend needs to be reachable; /api/v1 is exposed for
# scripts and the trainer's internal API stays on 127.0.0.1.
limit_req_zone $binary_remote_addr zone=qrlab_login:1m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name ailab.example.com;
    ssl_certificate     /etc/ssl/certs/ailab.crt;      # company CA
    ssl_certificate_key /etc/ssl/private/ailab.key;
    client_max_body_size 64m;                           # raised below for the upload routes
    large_client_header_buffers 4 32k;                  # the Auth.js session cookie holds the Keycloak tokens
    proxy_read_timeout 3600s;                           # SSE streams stay open for the whole job
    gzip off;                                           # SSE must not be buffered by compression

    # local-mode password logins: 10 per minute per client (the backend adds a per-account lockout)
    location = /api/v1/auth/login {
        limit_req zone=qrlab_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
    }
    location /api/v1/ {
        client_max_body_size 20g;                       # direct uploads from scripts (UPLOAD_MAX_MB / MODEL_ZOO_MAX_MB)
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
    }
    # browser uploads go through the frontend's streaming route handlers
    location ~ ^/api/(upload|tools/upload|admin/model-zoo)/ {
        client_max_body_size 20g;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
    }
}
server {
    listen 80;
    server_name ailab.example.com;
    return 301 https://$host$request_uri;
}
