# nginx site for QR AI Lab under a path prefix on a shared host:
#   https://qrit.tsmc.com/ai-lab       → Next.js frontend (127.0.0.1:3000), built with NEXT_PUBLIC_BASE_PATH=/ai-lab
#   https://qrit.tsmc.com/ai-lab-api   → FastAPI backend (127.0.0.1:8000), started with ROOT_PATH=/ai-lab-api
# The frontend proxies uploads, SSE and downloads to the backend itself (under /ai-lab/api/…), so browsers only need
# /ai-lab; /ai-lab-api is for scripts and the OpenAPI docs. Copy the `location` blocks into your existing
# `server { listen 443 ssl; server_name qrit.tsmc.com; … }` and put qr-ai-lab-proxy.conf in /etc/nginx/snippets/.
#
# Settings that must match the app: /etc/qr-ai-lab/frontend.env  NEXT_PUBLIC_BASE_PATH=/ai-lab  AUTH_URL=https://qrit.tsmc.com/ai-lab
#                                    /etc/qr-ai-lab/qrlab.env     ROOT_PATH=/ai-lab-api  CORS_ORIGINS=https://qrit.tsmc.com
# Keycloak client redirect URI: https://qrit.tsmc.com/ai-lab/api/auth/callback/keycloak

# in the http {} context (nginx.conf or a conf.d file): per-client rate limit for password logins
limit_req_zone $binary_remote_addr zone=qrlab_login:1m rate=10r/m;

# ---- inside server { listen 443 ssl; http2 on; server_name qrit.tsmc.com; … } ----------------------------------
# the Auth.js session cookie carries the Keycloak tokens (several KB); SSE streams stay open for the whole job
large_client_header_buffers 4 32k;

# --- backend API: strip /ai-lab-api, the app sees /api/v1/… and reports its public prefix through ROOT_PATH
location = /ai-lab-api { return 301 /ai-lab-api/; }
location = /ai-lab-api/api/v1/auth/login {
    limit_req zone=qrlab_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000/api/v1/auth/login;
    include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
}
location /ai-lab-api/ {
    client_max_body_size 20g;                   # direct uploads from scripts (UPLOAD_MAX_MB / MODEL_ZOO_MAX_MB)
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:8000/;          # trailing slash = prefix stripped
    include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
}

# --- frontend: keep the /ai-lab prefix (Next.js serves everything under its basePath, including the exact base path
# https://host/ai-lab that Auth.js sends people to after login; never redirect /ai-lab → /ai-lab/ here, Next.js
# redirects the other way (trailingSlash=false) and the two would loop)
location = /ai-lab {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
}
# browser uploads go through the frontend's streaming route handlers
location ~ ^/ai-lab/api/(upload|tools/upload|admin/model-zoo)/ {
    client_max_body_size 20g;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
}
# live job events (SSE): no buffering, long read timeout
location ^~ /ai-lab/api/stream/ {
    proxy_read_timeout 3600s;
    gzip off;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
}
location /ai-lab/ {
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:3000;           # no trailing slash = path kept (/ai-lab/…)
    include /etc/nginx/snippets/qr-ai-lab-proxy.conf;
}
