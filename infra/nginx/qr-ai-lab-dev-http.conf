# Goes in the http {} context (e.g. /etc/nginx/conf.d/qr-ai-lab-dev-http.conf): maps the Upgrade header for the
# websocket / HMR connections used by qr-ai-lab-dev.conf.
#   sudo cp infra/nginx/qr-ai-lab-dev-http.conf /etc/nginx/conf.d/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
