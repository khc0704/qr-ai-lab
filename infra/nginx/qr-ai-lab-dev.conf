# Development site for QR AI Lab behind nginx on plain HTTP (http://localhost/ai-lab), same URL layout as production:
#   /ai-lab      → Next.js dev server on 127.0.0.1:3000 (started with NEXT_PUBLIC_BASE_PATH=/ai-lab npm run dev)
#   /ai-lab-api  → FastAPI on 127.0.0.1:8000 (backend/.env: ROOT_PATH=/ai-lab-api, CORS_ORIGINS=http://localhost)
# Self-contained (no snippets, no rate limiting) so it can be dropped in as one file:
#   sudo cp infra/nginx/qr-ai-lab-dev.conf /etc/nginx/sites-available/qr-ai-lab-dev
#   sudo ln -sf /etc/nginx/sites-available/qr-ai-lab-dev /etc/nginx/sites-enabled/qr-ai-lab-dev
#   sudo rm -f /etc/nginx/sites-enabled/default        # it also listens on 80
#   sudo nginx -t && sudo systemctl reload nginx
# Matching app settings: frontend/.env.local  AUTH_URL=http://localhost/ai-lab  COOKIE_SECURE=0  (AUTH_MODE as usual)
#                        backend/.env         ROOT_PATH=/ai-lab-api  CORS_ORIGINS=http://localhost
# Keycloak client redirect URI (real Keycloak): http://localhost/ai-lab/api/auth/callback/keycloak
# For production (TLS, rate-limited login, shared server block) use qr-ai-lab.conf + qr-ai-lab-proxy.conf instead.

server {
    listen 80;
    server_name localhost;

    # the Auth.js session cookie carries the Keycloak tokens (several KB)
    large_client_header_buffers 4 32k;

    # --- backend API: strip /ai-lab-api; the app reports its public prefix through ROOT_PATH
    location = /ai-lab-api { return 301 /ai-lab-api/; }
    location /ai-lab-api/ {
        client_max_body_size 20g;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000/;          # trailing slash = prefix stripped
    }

    # --- frontend: keep the /ai-lab prefix (Next.js serves everything under its basePath, including the exact
    # base path; never redirect /ai-lab → /ai-lab/ here, Next redirects the other way and the two would loop)
    location ~ ^/ai-lab(/|$) {
        client_max_body_size 20g;                   # browser uploads stream through the frontend's route handlers
        proxy_read_timeout 3600s;                   # SSE job streams and uploads stay open
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /ai-lab;
        # Turbopack HMR (dev) and SSE use upgraded / long-lived connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_pass http://127.0.0.1:3000;           # no trailing slash = path kept (/ai-lab/…)
    }

    # anything else: send people to the app
    location = / { return 302 /ai-lab/; }
}
