# Infrastructure only: MariaDB and Redis. The application (backend API, scheduler, frontend) runs natively on the
# host as systemd services (infra/systemd/*) because jobs are host processes from the trainer venv — see
# docs/ARCHITECTURE.md §13 and docs/GETTING_STARTED.md §4.6.
#   cp infra/.env.example infra/.env
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
# Images come from the company's registry mirror: set DOCKER_REGISTRY in infra/.env (e.g. mirror.example.com/).
# Pin the tags to what the mirror holds (or to a digest, mariadb:11.4@sha256:…) so a re-pull never drifts.
# Data lives in host directories (bind mounts), not in named docker volumes: MARIADB_DATA_DIR / REDIS_DATA_DIR in
# infra/.env (relative paths resolve against this infra/ directory; defaults infra/data/mariadb, infra/data/redis —
# git-ignored). Back them up like any directory; `docker compose down` never touches them (there is no -v to forget).
name: qr-ai-lab

services:
  mariadb:
    image: ${DOCKER_REGISTRY:-}mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in infra/.env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-qr_ai_lab}
      MARIADB_USER: ${MARIADB_USER:-qr}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in infra/.env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - ${MARIADB_DATA_DIR:-./data/mariadb}:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
