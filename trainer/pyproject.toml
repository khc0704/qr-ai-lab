[project]
name = "qr-ai-lab-trainer"
version = "0.1.0"
description = "QR AI Lab training / inference runtime (jobs are host subprocesses in trainer/.venv)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "optuna>=3.6",
  "httpx>=0.27",
  "pyyaml>=6",
  "minio>=7.2",
]
# qrlab-preprocess (libs/preprocess) is installed editable through requirements*.txt (`-e ../libs/preprocess`);
# pip cannot resolve a path dependency from here.

[project.optional-dependencies]
# Deep-learning families. Installed into trainer/.venv on the GPU host (torch CUDA wheel, see infra/install.sh);
# pretrained weights come from the model zoo only (no downloads at job time).
dl = ["torch>=2.4", "torchvision>=0.19", "ultralytics>=8.3", "transformers>=4.44", "timm>=1.0", "safetensors>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
