name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: cd backend && pip install -r requirements-dev.txt
      - run: cd backend && ruff check . && ruff format --check .
      - run: cd backend && pytest -q
      - run: cd libs/preprocess && pytest -q

  trainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trainer/requirements-dev.txt
      # CPU-only wheels are enough for the unit tests; the deep-learning run happens on the GPU host.
      - run: cd trainer && pip install -r requirements-torch-cpu.txt && pip install -r requirements-dev.txt
      - run: cd trainer && ruff check . && ruff format --check .
      - run: cd trainer && pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint && npm run typecheck && npm run format:check && npm test
      - run: python3 scripts/design_lint.py frontend/src
